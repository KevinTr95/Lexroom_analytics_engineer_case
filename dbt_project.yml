name: 'lexroom_analytics'
version: '1.0.0'
profile: 'lexroom_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First and last week (Monday) in the data. "Last N weeks" windows are anchored here,
  # not to current_date: the events end on Sunday 2026-04-19.
  data_start_week: '2026-02-02'
  analysis_end_week: '2026-04-13'
  # The PR data starts one week earlier than the AMA events.
  prs_start_week: '2026-01-26'
  # Smoothing strength: number of "virtual" votes at the global rate (see README).
  smoothing_k: 10
  # Below this many weekly votes a rate is flagged as a small sample (Q1, Q3).
  min_votes_per_week: 50
  # Q2: below this many votes over the 8 weeks, a workspace's quality signal is flagged as weak.
  min_votes_per_workspace: 20
  # Q2: a workspace needs at least this many answers in the previous 4 weeks to get a risk score.
  min_answers_for_risk: 10

models:
  lexroom_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view   # a view, not ephemeral, so its grain can be tested
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
