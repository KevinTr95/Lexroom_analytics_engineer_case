name: 'lexroom_analytics'
version: '1.0.0'
profile: 'lexroom_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First and last week (Monday) in the data. "Last N weeks" windows are anchored here,
  # not to current_date: the events end on Sunday 2026-04-19.
  data_start_week: '2026-02-02'
  analysis_end_week: '2026-04-13'
  # The PR data starts one week earlier than the AMA events.
  prs_start_week: '2026-01-26'
  # Smoothing strength: number of "virtual" votes at the global rate (see README).
  smoothing_k: 10
  # Below this many weekly votes a rate is flagged as a small sample.
  min_votes_per_week: 50
  # Q2: a workspace needs at least this many answers in the previous 4 weeks to get a risk score.
  min_answers_for_risk: 10

seeds:
  lexroom_analytics:
    +schema: raw
    raw_events_ama:
      +column_types:
        event_id: varchar
        user_id: varchar
        workspace_id: varchar
        module_tag: varchar
        response_latency_ms: bigint
        response_tokens: bigint
        retrieved_chunks: bigint
        is_cached: boolean
        created_at: timestamptz
    raw_feedback_ama:
      +column_types:
        feedback_id: varchar
        event_id: varchar
        user_id: varchar
        thumbs: integer
        reason_tag: varchar
        free_text: varchar
        created_at: timestamptz
    raw_users:
      +column_types:
        user_id: varchar
        workspace_id: varchar
        role: varchar
        created_at: timestamptz
        is_deleted: boolean
    raw_workspaces:
      +column_types:
        workspace_id: varchar
        country: varchar
        plan: varchar
        firm_size_bucket: varchar
        signup_date: date
    raw_engineering_prs:
      +column_types:
        pr_id: varchar
        author_id: varchar
        team: varchar
        created_at: timestamptz
        merged_at: timestamptz
        lines_added: bigint
        lines_deleted: bigint
        review_comments_count: bigint

models:
  lexroom_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view   # a view, not ephemeral, so its grain can be tested
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
